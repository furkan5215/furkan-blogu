<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Survivor | En İyi Skorlu Sürüm</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050508; overflow: hidden; touch-action: none; font-family: 'Orbitron', sans-serif; user-select: none; color: white; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; z-index: 20; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        .stats-box { background: rgba(0, 243, 255, 0.1); padding: 10px 20px; border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 8px; backdrop-filter: blur(5px); text-align: right; }
        .stats-box span { display: block; font-size: 1.2rem; font-weight: 700; color: #fff; }
        .level-text { font-size: 2rem; font-weight: 900; color: #00f3ff; letter-spacing: 2px; }
        
        .xp-container { width: 300px; height: 12px; background: rgba(255,255,255,0.05); border-radius: 20px; margin-top: 15px; overflow: hidden; border: 1px solid rgba(0, 243, 255, 0.4); }
        #xp-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #00f3ff, #0055ff); transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        .hp-container { width: 300px; height: 16px; background: rgba(255,0,0,0.1); border-radius: 20px; margin-top: 10px; overflow: hidden; border: 1px solid #ff003c; }
        #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ff003c, #ff5500); transition: width 0.3s ease; }

        #damage-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-shadow: inset 0 0 150px rgba(255,0,0,0); transition: box-shadow 0.2s ease; z-index: 15; }
        .heartbeat { animation: pump 1s infinite alternate; }
        @keyframes pump { 0% { box-shadow: inset 0 0 50px rgba(255,0,0,0.3); } 100% { box-shadow: inset 0 0 150px rgba(255,0,60,0.8); } }

        #combo-display { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; font-weight: 900; color: #ff00ff; opacity: 0; transition: opacity 0.3s, transform 0.1s; text-align: center; pointer-events: none; }
        .rampage { color: #ff8800 !important; font-size: 4rem !important; animation: shake 0.3s infinite; }
        @keyframes shake { 0% { transform: translate(-50%, -50%) rotate(-2deg); } 50% { transform: translate(-50%, -50%) rotate(2deg); } 100% { transform: translate(-50%, -50%) rotate(-2deg); } }

        #level-up-modal, #game-over-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,10,20,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 100; }
        #level-up-modal h1 { color: #00f3ff; font-size: 3.5rem; margin-bottom: 40px; letter-spacing: 4px; text-align: center; }
        
        .card-container { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; max-width: 900px; padding: 20px; }
        .upgrade-card { background: rgba(20,20,35,0.9); border: 2px solid rgba(0, 243, 255, 0.5); padding: 30px 20px; border-radius: 16px; text-align: center; cursor: pointer; transition: 0.2s; width: 240px; display: flex; flex-direction: column; align-items: center; }
        .upgrade-card:hover { transform: translateY(-10px); border-color: #00f3ff; background: rgba(0, 243, 255, 0.1); }
        .upgrade-card h3 { font-size: 1.4rem; margin-bottom: 15px; color: #fff; }
        .upgrade-card p { font-size: 0.95rem; color: #a0aec0; font-family: 'Segoe UI', sans-serif;}
        .card-icon { font-size: 3rem; margin-bottom: 15px; }

        #game-over-modal h1 { color: #ff003c; font-size: 4rem; margin-bottom: 10px; }
        #game-over-modal p { font-size: 1.2rem; color: #aaa; margin-bottom: 10px; text-align: center; line-height: 1.6; }
        #restart-btn { background: #00f3ff; color: #000; border: none; padding: 15px 40px; font-size: 1.5rem; font-weight: bold; font-family: 'Orbitron'; cursor: pointer; border-radius: 8px; margin-top: 20px; }

        #joystick-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; z-index: 10;}
        #joystick-base { position: absolute; width: 120px; height: 120px; background: rgba(0, 243, 255, 0.05); border: 2px solid rgba(0, 243, 255, 0.2); border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; }
        #joystick-stick { position: absolute; width: 50px; height: 50px; background: rgba(0, 243, 255, 0.8); border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="joystick-zone"></div>
    <div id="joystick-base"></div>
    <div id="joystick-stick"></div>
    <div id="damage-flash"></div>

    <div id="ui-layer">
        <div class="top-bar">
            <div>
                <div class="level-text" id="level-display">LVL 1</div>
                <div class="xp-container"><div id="xp-bar"></div></div>
                <div class="hp-container"><div id="hp-bar"></div></div>
            </div>
            <div class="stats-box">
                <span style="font-size: 0.9rem; color: #888;">SÜRE</span>
                <span id="time-display">00:00</span>
                <span style="font-size: 0.9rem; color: #888; margin-top: 5px;">SKOR</span>
                <span id="score-display">0</span>
            </div>
        </div>
        <div id="combo-display"></div>
    </div>

    <div id="level-up-modal">
        <h1>YETENEK SEÇ</h1>
        <div class="card-container" id="card-container"></div>
    </div>

    <!-- OYUN BİTTİ EKRANI (EN İYİ SKOR GÖSTERGESİ İLE) -->
    <div id="game-over-modal">
        <h1>OYUN BİTTİ</h1>
        <p>
            Hayatta Kalınan Süre: <span id="final-time"></span><br>
            Skor: <span id="final-score" style="color: #fff; font-weight: bold;"></span><br>
            <span style="color: #00f3ff; font-size: 1.1rem;">🏆 En İyi Skor: <span id="high-score">0</span></span>
        </p>
        <button id="restart-btn" onclick="location.reload()">TEKRAR DENE</button>
    </div>

    <script>
        // --- SES MOTORU ---
        let audioCtx;
        function initAudio() {
            if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if(audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if(type === 'shoot') { osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1); gain.gain.setValueAtTime(0.02, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); } 
            else if(type === 'xp') { osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now); osc.frequency.exponentialRampToValueAtTime(1800, now + 0.05); gain.gain.setValueAtTime(0.02, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1); } 
            else if(type === 'levelup') { osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(800, now + 0.2); gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.4); osc.start(now); osc.stop(now + 0.4); }
        }

        // --- KURULUM ---
        const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
        const ui = { 
            xpBar: document.getElementById('xp-bar'), hpBar: document.getElementById('hp-bar'), level: document.getElementById('level-display'), score: document.getElementById('score-display'), 
            time: document.getElementById('time-display'), levelModal: document.getElementById('level-up-modal'), cardContainer: document.getElementById('card-container'), combo: document.getElementById('combo-display'),
            damageFlash: document.getElementById('damage-flash'), gameOverModal: document.getElementById('game-over-modal'), finalTime: document.getElementById('final-time'), finalScore: document.getElementById('final-score'), highScore: document.getElementById('high-score')
        };
        const joyBase = document.getElementById('joystick-base'), joyStick = document.getElementById('joystick-stick'), joyZone = document.getElementById('joystick-zone');

        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        let lastTime = 0, gameTime = 0, isPaused = false, isGameOver = false, score = 0, camera = { x: 0, y: 0 }, screenShake = 0;
        let comboCount = 0, comboTimer = 0, rampageActive = false, rampageTimer = 0;
        
        // --- LOCAL STORAGE (EN İYİ SKOR HAFIZASI) ---
        let highScore = localStorage.getItem('neon_high_score') || 0;

        let entities = { enemies: [], bullets: [], particles: [], gems: [], texts: [], paints: [] };

        const player = {
            x: 0, y: 0, radius: 15, speed: 280, hp: 100, maxHp: 100, color: '#00f3ff',
            damage: 25, fireRate: 1.2, shootCooldown: 0, multiShot: 1, critChance: 0.15,
            level: 1, xp: 0, xpNeeded: 50, vx: 0, vy: 0
        };

        const upgradePool = [
            { id: 'damage', icon: '💥', title: 'Ateş Gücü', desc: 'Mermi hasarını kalıcı olarak %25 artırır.' },
            { id: 'firerate', icon: '⚡', title: 'Seri Atış', desc: 'Silahın ateş etme hızını %20 hızlandırır.' },
            { id: 'multishot', icon: '🔫', title: 'Çift Namlu', desc: 'Mermi sayısını artırır (Sınır Yok).' },
            { id: 'heal', icon: '⚕️', title: 'Nanobot Zırh', desc: 'Maksimum Canı %25 artırır ve canı fuller.' },
            { id: 'speed', icon: '🚀', title: 'Motor Gücü', desc: 'Hareket hızını %15 artırır.' },
            { id: 'crit', icon: '🎯', title: 'Keskin Nişancı', desc: 'Kritik vuruş ihtimalini artırır.' }
        ];

        // --- JOYSTICK ---
        let isDragging = false, joyOrigin = { x: 0, y: 0 };
        joyZone.addEventListener('pointerdown', e => {
            initAudio(); if(isPaused || isGameOver) return;
            isDragging = true; joyOrigin = { x: e.clientX, y: e.clientY };
            joyBase.style.left = e.clientX + 'px'; joyBase.style.top = e.clientY + 'px';
            joyStick.style.left = e.clientX + 'px'; joyStick.style.top = e.clientY + 'px';
            joyBase.style.display = 'block'; joyStick.style.display = 'block';
        });
        joyZone.addEventListener('pointermove', e => {
            if (!isDragging || isPaused || isGameOver) return;
            const dx = e.clientX - joyOrigin.x, dy = e.clientY - joyOrigin.y;
            const distance = Math.hypot(dx, dy), maxRadius = 60;
            let angle = Math.atan2(dy, dx), clampedDist = Math.min(distance, maxRadius);
            joyStick.style.left = (joyOrigin.x + Math.cos(angle) * clampedDist) + 'px'; joyStick.style.top = (joyOrigin.y + Math.sin(angle) * clampedDist) + 'px';
            player.vx = (Math.cos(angle) * clampedDist) / maxRadius; player.vy = (Math.sin(angle) * clampedDist) / maxRadius;
        });
        window.addEventListener('pointerup', () => { isDragging = false; player.vx = 0; player.vy = 0; joyBase.style.display = 'none'; joyStick.style.display = 'none'; });

        // --- SINIFLAR ---
        class Paint {
            constructor(x, y, color, size) { this.x = x; this.y = y; this.color = color; this.radius = size; }
            draw() {
                ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = this.color; ctx.fill(); ctx.globalAlpha = 1;
            }
        }

        class Enemy {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type;
                this.radius = type === 'tank' ? 28 : (type === 'dasher' ? 14 : 18);
                let timeScale = Math.min(1.5, 1 + (gameTime / 600)); 
                let baseSpeed = type === 'tank' ? 90 : (type === 'dasher' ? 180 : 130); 
                this.speed = baseSpeed * timeScale;
                this.hp = (type === 'tank' ? 200 : 50) * (1 + (gameTime / 120));
                this.color = type === 'tank' ? '#ff3300' : (type === 'dasher' ? '#cc00ff' : '#ff0055');
                this.damage = type === 'tank' ? 25 : 10;
            }
            update(dt) {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(angle) * this.speed * dt; this.y += Math.sin(angle) * this.speed * dt;
                if (Math.hypot(player.x - this.x, player.y - this.y) < this.radius + player.radius) {
                    player.hp -= this.damage * dt; 
                    ui.damageFlash.style.boxShadow = 'inset 0 0 150px rgba(255,0,0,0.6)';
                    setTimeout(() => ui.damageFlash.style.boxShadow = 'inset 0 0 150px rgba(255,0,0,0)', 100);
                    if(player.hp <= 0 && !isGameOver) { triggerGameOver(); }
                    updateUI();
                }
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = '#050508'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = this.color; ctx.stroke();
            }
        }

        class Bullet {
            constructor(x, y, angle, damage) {
                this.x = x; this.y = y; this.vx = Math.cos(angle) * 1200; this.vy = Math.sin(angle) * 1200; 
                this.damage = damage; this.radius = 5; this.life = 1.5;
            }
            update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt; }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = rampageActive ? '#ff8800' : '#00f3ff'; ctx.fill();
            }
        }

        class Gem {
            constructor(x, y, value) { this.x = x; this.y = y; this.value = value; this.radius = 6; }
            update(dt) {
                const dist = Math.hypot(player.x - this.x, player.y - this.y);
                if (dist < 150) { 
                    const angle = Math.atan2(player.y - this.y, player.x - this.x);
                    this.x += Math.cos(angle) * 600 * dt; this.y += Math.sin(angle) * 600 * dt;
                }
                if (dist < player.radius + this.radius) { this.life = 0; gainXP(this.value); playSound('xp'); }
            }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fillStyle = '#00ff88'; ctx.fill(); }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 300 + 50;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.life = 1; this.radius = Math.random() * 4 + 1;
            }
            update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt; }
            draw() { ctx.globalAlpha = Math.max(0, this.life); ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); ctx.fillStyle = this.color; ctx.fill(); ctx.globalAlpha = 1; }
        }

        class FloatingText {
            constructor(x, y, text, isCrit) { this.x = x + (Math.random()*20-10); this.y = y; this.text = text; this.life = isCrit ? 0.8 : 0.4; this.vy = -60; this.isCrit = isCrit; }
            update(dt) { this.y += this.vy * dt; this.life -= dt; }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.isCrit ? '#ff003c' : '#fff'; ctx.font = `bold ${this.isCrit ? 22 : 14}px Orbitron`; ctx.fillText(this.text, this.x, this.y); ctx.globalAlpha = 1;
            }
        }

        // --- OYUN MEKANİKLERİ ---
        function gainXP(amount) {
            player.xp += amount;
            if (player.xp >= player.xpNeeded) {
                player.level++; player.xp -= player.xpNeeded;
                player.xpNeeded = Math.floor(player.xpNeeded * 1.3 + 20); 
                showLevelUp();
            }
            updateUI();
        }

        function triggerComboKill() {
            comboCount++; comboTimer = 3; 
            ui.combo.innerText = comboCount + " HİT"; ui.combo.style.opacity = 1;
            ui.combo.style.transform = `translate(-50%, -50%) scale(1.2)`;
            setTimeout(() => ui.combo.style.transform = `translate(-50%, -50%) scale(1)`, 100);
            if(comboCount % 20 === 0 && comboCount > 0) {
                rampageActive = true; rampageTimer = 5; ui.combo.innerText = "RAMPAGE! x" + comboCount; ui.combo.classList.add('rampage'); playSound('levelup'); 
            }
        }

        function updateUI() {
            ui.xpBar.style.width = (player.xp / player.xpNeeded) * 100 + '%';
            ui.hpBar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            ui.level.innerText = 'LVL ' + player.level; ui.score.innerText = score.toLocaleString();
            if(player.hp / player.maxHp < 0.3) ui.damageFlash.classList.add('heartbeat'); else ui.damageFlash.classList.remove('heartbeat');
        }

        function showLevelUp() {
            playSound('levelup'); isPaused = true; joyZone.style.pointerEvents = 'none';
            let shuffled = [...upgradePool].sort(() => 0.5 - Math.random()); let selected = shuffled.slice(0, 3);
            ui.cardContainer.innerHTML = ''; 
            selected.forEach(u => {
                ui.cardContainer.innerHTML += `<div class="upgrade-card" onclick="applyUpgrade('${u.id}')"><div class="card-icon">${u.icon}</div><h3>${u.title}</h3><p>${u.desc}</p></div>`;
            });
            ui.levelModal.style.display = 'flex';
        }

        function applyUpgrade(type) {
            if(type === 'damage') player.damage *= 1.25; 
            else if(type === 'firerate') player.fireRate *= 1.20; 
            else if(type === 'multishot') player.multiShot += 1;
            else if(type === 'heal') { player.maxHp = Math.floor(player.maxHp * 1.25); player.hp = player.maxHp; }
            else if(type === 'speed') player.speed *= 1.15;
            else if(type === 'crit') player.critChance += 0.15;
            
            ui.levelModal.style.display = 'none'; joyZone.style.pointerEvents = 'auto';
            isPaused = false; lastTime = performance.now(); updateUI();
        }

        function triggerGameOver() {
            isGameOver = true; isPaused = true; joyZone.style.pointerEvents = 'none';
            
            // REKOR KONTROLÜ VE KAYDI
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neon_high_score', highScore);
            }

            const m = Math.floor(gameTime / 60).toString().padStart(2, '0'); const s = Math.floor(gameTime % 60).toString().padStart(2, '0');
            ui.finalTime.innerText = `${m}:${s}`; 
            ui.finalScore.innerText = score.toLocaleString();
            ui.highScore.innerText = Number(highScore).toLocaleString();
            ui.gameOverModal.style.display = 'flex';
        }

        let spawnTimer = 0;
        function spawnManager(dt) {
            if (entities.enemies.length >= 120) return; 
            spawnTimer -= dt;
            if (spawnTimer <= 0) {
                spawnTimer = Math.max(0.15, 1.2 - (gameTime / 150)); 
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.max(canvas.width, canvas.height) / 2 + 100;
                const ex = player.x + Math.cos(angle) * dist, ey = player.y + Math.sin(angle) * dist;
                const rand = Math.random(); let type = 'normal';
                if(gameTime > 20 && rand < 0.25) type = 'dasher';
                if(gameTime > 60 && rand > 0.8) type = 'tank';
                entities.enemies.push(new Enemy(ex, ey, type));
            }
        }

        function autoShoot(dt) {
            player.shootCooldown -= dt;
            if (player.shootCooldown <= 0 && entities.enemies.length > 0) {
                let target = null, minDist = Infinity;
                entities.enemies.forEach(e => {
                    const dist = Math.hypot(e.x - player.x, e.y - player.y);
                    if (dist < minDist) { minDist = dist; target = e; }
                });

                if (target && minDist < 900) { 
                    let currentFireRate = rampageActive ? player.fireRate * 1.5 : player.fireRate;
                    player.shootCooldown = 1 / currentFireRate;
                    playSound('shoot');
                    const baseAngle = Math.atan2(target.y - player.y, target.x - player.x);
                    const spread = Math.min(0.3, (Math.PI * 2) / player.multiShot); 
                    const startAngle = baseAngle - (spread * (player.multiShot - 1)) / 2;
                    for (let i = 0; i < player.multiShot; i++) {
                        const angle = startAngle + i * spread;
                        entities.bullets.push(new Bullet(player.x, player.y, angle, player.damage));
                    }
                }
            }
        }

        // --- ANA DÖNGÜ ---
        function update(currentTime) {
            requestAnimationFrame(update);
            if (isGameOver) return; 

            let dt = (currentTime - lastTime) / 1000;
            if(dt > 0.1) dt = 0.1; lastTime = currentTime;

            if (isPaused) return;
            gameTime += dt;
            
            const m = Math.floor(gameTime / 60).toString().padStart(2, '0');
            const s = Math.floor(gameTime % 60).toString().padStart(2, '0');
            ui.time.innerText = `${m}:${s}`;

            if(comboTimer > 0) { comboTimer -= dt; if(comboTimer <= 0) { comboCount = 0; ui.combo.style.opacity = 0; } }
            if(rampageActive) { rampageTimer -= dt; if(rampageTimer <= 0) { rampageActive = false; ui.combo.classList.remove('rampage'); } }

            player.x += player.vx * player.speed * dt; player.y += player.vy * player.speed * dt;

            if (screenShake > 0) {
                screenShake -= dt * 30;
                camera.x = player.x - canvas.width / 2 + (Math.random() - 0.5) * screenShake;
                camera.y = player.y - canvas.height / 2 + (Math.random() - 0.5) * screenShake;
            } else {
                camera.x = player.x - canvas.width / 2; camera.y = player.y - canvas.height / 2;
            }

            spawnManager(dt); autoShoot(dt);

            ctx.fillStyle = '#050508'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.translate(-camera.x, -camera.y);

            ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)'; ctx.lineWidth = 1;
            const gridSize = 150;
            const startX = Math.floor(camera.x / gridSize) * gridSize; const startY = Math.floor(camera.y / gridSize) * gridSize;
            ctx.beginPath();
            for(let x = startX; x < startX + canvas.width + gridSize; x += gridSize) { ctx.moveTo(x, camera.y); ctx.lineTo(x, camera.y + canvas.height); }
            for(let y = startY; y < startY + canvas.height + gridSize; y += gridSize) { ctx.moveTo(camera.x, y); ctx.lineTo(camera.x + canvas.width, y); }
            ctx.stroke();

            entities.paints.forEach(p => p.draw());

            entities.gems.forEach(g => { g.update(dt); g.draw(); }); entities.gems = entities.gems.filter(g => g.life !== 0);
            entities.particles.forEach(p => { p.update(dt); p.draw(); }); entities.particles = entities.particles.filter(p => p.life > 0);
            entities.bullets.forEach(b => { b.update(dt); b.draw(); });
            entities.enemies.forEach(e => { e.update(dt); e.draw(); });
            entities.texts.forEach(t => { t.update(dt); t.draw(); }); entities.texts = entities.texts.filter(t => t.life > 0);

            for (let i = entities.bullets.length - 1; i >= 0; i--) {
                let b = entities.bullets[i]; let hit = false;
                for (let j = entities.enemies.length - 1; j >= 0; j--) {
                    let e = entities.enemies[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
                        let isCrit = Math.random() < player.critChance;
                        let finalDamage = isCrit ? b.damage * 2.5 : b.damage;
                        e.hp -= finalDamage; hit = true;
                        entities.texts.push(new FloatingText(e.x, e.y, Math.round(finalDamage), isCrit));
                        
                        if (e.hp <= 0) {
                            score += e.type === 'tank' ? 50 : 10; updateUI(); screenShake = e.type === 'tank' ? 10 : 2; 
                            entities.paints.push(new Paint(e.x, e.y, e.color, e.type === 'tank' ? 40 : 20));
                            if(entities.paints.length > 60) entities.paints.shift(); 
                            for(let k=0; k<6; k++) entities.particles.push(new Particle(e.x, e.y, e.color));
                            entities.gems.push(new Gem(e.x, e.y, e.type === 'tank' ? 30 : 10)); 
                            entities.enemies.splice(j, 1); triggerComboKill();
                        }
                        break; 
                    }
                }
                if (hit || b.life <= 0) entities.bullets.splice(i, 1);
            }

            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
            ctx.fillStyle = player.color; ctx.fill();
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 8, 0, Math.PI*2); ctx.strokeStyle = (rampageActive ? 'rgba(255, 136, 0, 0.8)' : 'rgba(0, 243, 255, 0.5)'); ctx.lineWidth = (rampageActive ? 4 : 2); ctx.stroke();

            ctx.restore();
        }

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        updateUI(); requestAnimationFrame(time => { lastTime = time; update(time); });
    </script>
</body>
</html>
