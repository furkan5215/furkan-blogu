<style>

.bar.h{height:16px;border-color:#ff003c;background:rgba(255,0,60,.1)}
.bar i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#00f3ff,#0055ff);will-change:transform}
.bar.h i{background:linear-gradient(90deg,#ff003c,#ff7a00);transform:scaleX(1)}
.bar span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:14px;font-weight:700}
.r{text-align:right;background:rgba(0,243,255,.08);border:1px solid rgba(0,243,255,.3);border-radius:10px;padding:8px 14px;align-self:flex-start}
.r small{display:block;font-size:10px;color:var(--mt)}.r b{display:block;font-size:clamp(15px,4vw,19px);margin-bottom:3px}
#cb{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-size:clamp(26px,8vw,44px);font-weight:900;color:#ff00ff;opacity:0;pointer-events:none;text-shadow:0 0 20px #f0f;white-space:nowrap}
#cb.ra{color:#ff8800;text-shadow:0 0 24px #f80}
#bn{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:clamp(18px,6vw,32px);font-weight:900;letter-spacing:3px;color:#ffd400;opacity:0;pointer-events:none;text-shadow:0 0 18px #fa0}
#bn.on{animation:bn 2.2s ease-out}
@keyframes bn{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.08)}80%{opacity:1}100%{opacity:0}}
#jb,#js{position:fixed;left:0;top:0;border-radius:50%;display:none;pointer-events:none;will-change:transform}
#jb{width:112px;height:112px;margin:-56px 0 0 -56px;border:2px solid rgba(0,243,255,.3);background:rgba(0,243,255,.05)}
#js{width:48px;height:48px;margin:-24px 0 0 -24px;background:rgba(0,243,255,.8);box-shadow:0 0 18px #00f3ff}
.modal{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:rgba(2,8,18,.92);backdrop-filter:blur(6px);overflow-y:auto;touch-action:pan-y;text-align:center;z-index:50}
.modal.on{display:flex}
.modal h2{font-size:clamp(24px,7vw,38px);color:var(--cy);letter-spacing:3px;text-shadow:0 0 18px var(--cy)}
.modal h2.rd{color:var(--rd);text-shadow:0 0 18px var(--rd)}
.modal p{color:#b6c4d6;line-height:1.9;font-size:15px}.modal p b{color:#fff}
.cards{display:grid;gap:10px;width:min(430px,92vw)}
.card{display:grid;grid-template-columns:56px 1fr;grid-template-areas:"i h" "i p" "i s";column-gap:12px;align-items:center;text-align:left;background:rgba(20,22,40,.95);border:2px solid rgba(0,243,255,.45);border-radius:14px;padding:12px 14px;color:var(--ink);font-family:inherit;cursor:pointer}
.card:active,.card:hover{border-color:var(--cy);background:rgba(0,243,255,.12)}
.card b{grid-area:i;font-size:34px;text-align:center}.card h3{grid-area:h;font-size:15px}
.card p{grid-area:p;font:13px/1.3 system-ui,sans-serif;color:#a9b8cc}.card small{grid-area:s;font-size:10px;color:var(--cy)}
.btn{background:var(--cy);color:#001;border:0;border-radius:12px;padding:15px 38px;font:900 18px Orbitron,sans-serif;cursor:pointer;box-shadow:0 0 24px -4px var(--cy)}
.rec{background:linear-gradient(90deg,#ffd400,#ff5500);color:#210;font-weight:900;font-size:12px;padding:5px 14px;border-radius:99px}
#lb-box{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:82px;background:rgba(0,243,255,.06);border:1px solid rgba(0,243,255,.25);border-radius:8px;padding:8px 12px;font-size:11px;color:#a9b8cc;pointer-events:none;text-align:right;z-index:20;min-width:130px}
#lb-box b{color:var(--cy);display:block;margin-bottom:5px;font-size:11px;letter-spacing:1px}
.lb-r{display:flex;justify-content:space-between;gap:10px;margin-top:3px;border-bottom:1px solid rgba(255,255,255,.05);padding-bottom:2px}
.lb-r span:last-child{color:#fff;font-weight:700}
#in-name{background:rgba(0,0,0,.6);border:2px solid var(--cy);color:#fff;padding:12px;border-radius:8px;font:18px Orbitron,sans-serif;text-align:center;width:220px;outline:none;margin:8px 0}
#in-name:focus{box-shadow:0 0 15px var(--cy);background:rgba(0,243,255,.1)}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrNq8_KP8RGscSRdOesV3-L7VwrQ_14RU",
  authDomain: "foyun-9cd44.firebaseapp.com",
  projectId: "foyun-9cd44",
  storageBucket: "foyun-9cd44.firebasestorage.app",
  messagingSenderId: "971696162998",
  appId: "1:971696162998:web:06b1020590b85a66cd3e17"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.globalLB = [];

// Canlı Dinleyici (Skor değiştikçe sağ üst anında güncellenir)
const q = query(collection(db, "scores"), orderBy("s", "desc"), limit(3));
onSnapshot(q, (snapshot) => {
  const list = [];
  snapshot.forEach(doc => list.push(doc.data()));
  window.globalLB = list;
  if(window.drawLB) window.drawLB();
}, (err) => console.log("LB hatası:", err));

window.sendScoreToFirestore = async (name, sc) => {
  try {
    await addDoc(collection(db, "scores"), {
      n: name,
      s: sc,
      t: Date.now()
    });
  } catch(e) {
    console.error("Kayıt hatası:", e);
  }
};
</script>
</head>
<body>
<div id="app">
 <canvas id="cv" aria-label="Oyun alanı"></canvas>
 <div id="fl"></div>
 <div id="hud">
  <div><div id="lv">SV 1</div><div class="bar"><i id="xb"></i></div><div class="bar h"><i id="hb"></i><span id="ht"></span></div></div>
  <div class="r"><small>SÜRE</small><b id="tm">00:00</b><small>SKOR</small><b id="sc">0</b></div>
 </div>
 <div id="lb-box"></div>
 <div id="cb"></div><div id="bn"></div>
 <div id="jb"></div><div id="js"></div>
 <div id="md" class="modal"></div>
</div>
<script>
const $=i=>document.getElementById(i),R=Math.random,TAU=Math.PI*2;
const cv=$("cv"),c=cv.getContext("2d",{alpha:false});
const store={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const fmt=n=>Math.round(n).toLocaleString("tr-TR"),fn=d=>d>=1e6?(d/1e6).toFixed(1)+"M":d>=1e3?(d/1e3).toFixed(1)+"K":Math.round(d)+"";
const mmss=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");

window.drawLB = function() {
 const lb = window.globalLB || [];
 let h = "<b>🌍 GLOBAL İLK 3</b>";
 if(!lb.length) h += "<div class='lb-r'><span>Yükleniyor...</span></div>";
 else lb.forEach((x,i)=>h+=`<div class='lb-r'><span>${i+1}. ${x.n}</span><span>${fmt(x.s)}</span></div>`);
 $("lb-box").innerHTML = h;
};

let W,H,dpr,Z,VW,VH;
function resize(){const a=$("app");W=a.clientWidth;H=a.clientHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);Z=Math.max(.6,Math.min(1.5,Math.min(W,H)/620));VW=W/Z;VH=H/Z}
addEventListener("resize",resize);addEventListener("orientationchange",()=>setTimeout(resize,250));if(window.visualViewport)visualViewport.addEventListener("resize",resize);

let ac,sT={};
function snd(k){if(!ac)return;const n=ac.currentTime;if((sT[k]||0)>n)return;sT[k]=n+(k==="k"?.05:.04);try{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
 if(k==="k"){o.type="square";o.frequency.setValueAtTime(150,n);o.frequency.exponentialRampToValueAtTime(40,n+.15);g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.001,n+.15);o.start(n);o.stop(n+.15)}
 else if(k==="xp"){o.type="sine";o.frequency.setValueAtTime(1200,n);o.frequency.exponentialRampToValueAtTime(1800,n+.05);g.gain.setValueAtTime(.02,n);g.gain.exponentialRampToValueAtTime(.001,n+.08);o.start(n);o.stop(n+.08)}
 else{o.type="square";o.frequency.setValueAtTime(400,n);o.frequency.setValueAtTime(800,n+.15);g.gain.setValueAtTime(.05,n);g.linearRampToValueAtTime(0,n+.35);o.start(n);o.stop(n+.35)}}catch(e){}}

const UP=[
{id:"dmg",i:"💥",n:"Ateş Gücü",d:"Hasar +%25",f:p=>p.dmg*=1.25},
{id:"rate",i:"⚡",n:"Seri Atış",d:"Ateş hızı +%18",f:p=>p.rate*=1.18},
{id:"multi",i:"🔫",n:"Çoklu Namlu",d:"+1 mermi (sınır yok)",f:p=>p.multi++},
{id:"hp",i:"❤️",n:"Nanobot Zırh",d:"Maks. can +%25 ve tam şifa",f:p=>{p.mhp=Math.round(p.mhp*1.25);p.hp=p.mhp}},
{id:"spd",i:"🚀",n:"Motor Gücü",d:"Hız +%10",f:p=>p.spd*=1.1},
{id:"crit",i:"🎯",n:"Keskin Nişancı",d:"Kritik şansı +%12",f:p=>p.crit+=.12},
{id:"cdm",i:"☠️",n:"Ölümcül Vuruş",d:"Kritik hasarı +%40",f:p=>p.cdm+=.4},
{id:"pierce",i:"🏹",n:"Delici Mermi",d:"Mermiler +1 düşmanı deler",f:p=>p.pierce++},
{id:"orb",i:"🌀",n:"Dönen Bıçaklar",d:"Çevrende dönen +1 bıçak",f:p=>p.orb++},
{id:"mag",i:"🧲",n:"Mıknatıs",d:"Toplama alanı +%35",f:p=>p.mag*=1.35},
{id:"xp",i:"📈",n:"Hızlı Öğrenme",d:"XP kazancı +%20",f:p=>p.xpm*=1.2},
{id:"reg",i:"🩹",n:"Yenilenme",d:"Saniyede +1.5 can yeniler",f:p=>p.reg+=1.5},
{id:"arm",i:"🛡️",n:"Plazma Kalkan",d:"Gelen hasar -%12",f:p=>p.arm*=.88},
{id:"boom",i:"💣",n:"Patlayıcı Uç",d:"Mermiler patlar, alan büyür",f:p=>p.boom++},
{id:"nova",i:"🌟",n:"Nova Dalgası",d:"Şok dalgası atar",f:p=>p.nova++}];
const TY={n:{r:15,hp:36,sp:115,dm:10,xp:6,sc:10,c:"#ff0055"},d:{r:12,hp:28,sp:185,dm:8,xp:9,sc:15,c:"#cc00ff"},t:{r:26,hp:230,sp:78,dm:20,xp:36,sc:50,c:"#ff5500"},e:{r:40,hp:2600,sp:92,dm:30,xp:260,sc:500,c:"#ffd400"}};

let P,Es,Bu,Pa,Gm,Tx,Pn,Rg,cam,t,score,combo,comboT,rampT,shake,paused,over,pend,spT,hordeT,eliteT,flash,uiT,last=performance.now(),grid=new Map(),ox=0,oy=0;
const SZ=100,best=()=>({t:+store.g("ns.t")||0,l:+store.g("ns.l")||1});

function init(){P={x:0,y:0,vx:0,vy:0,r:14,hp:100,mhp:100,spd:250,dmg:25,rate:1.3,multi:1,crit:.12,cdm:2.5,pierce:0,orb:0,mag:140,xpm:1,reg:0,arm:1,boom:0,nova:0,novaT:3,cd:0,lv:1,xp:0,need:40,up:{},tr:0};
 Es=[];Bu=[];Pa=[];Gm=[];Tx=[];Pn=[];Rg=[];cam={x:0,y:0};t=0;score=0;combo=0;comboT=0;rampT=0;shake=0;paused=false;over=false;pend=0;spT=0;hordeT=35;eliteT=50;flash=0;uiT=0;$("md").className="modal";$("cb").style.opacity=0;ui();drawLB();}
function ui(){$("lv").textContent="SV "+P.lv;$("xb").style.transform="scaleX("+Math.min(1,P.xp/P.need)+")";$("hb").style.transform="scaleX("+Math.max(0,P.hp/P.mhp)+")";$("ht").textContent=Math.ceil(Math.max(0,P.hp))+" / "+P.mhp;$("tm").textContent=mmss(t);$("sc").textContent=fmt(score)}
function banner(s){const e=$("bn");e.textContent=s;e.classList.remove("on");void e.offsetWidth;e.classList.add("on")}

function gain(a){P.xp+=a*P.xpm;while(P.xp>=P.need){P.xp-=P.need;P.lv++;P.need=Math.floor(P.need*1.17+14);pend++}if(pend&&!paused)offer()}
function offer(){paused=true;const cs=[...UP].sort(()=>R()-.5).slice(0,3);
 $("md").innerHTML=`<h2>SEVİYE ${P.lv}${pend>1?" · "+pend+" SEÇİM":""}</h2><div class="cards">`+cs.map(u=>{const s=P.up[u.id]||0;return`<button class="card" data-u="${u.id}"><b>${u.i}</b><h3>${u.n}</h3><p>${u.d}</p><small>Sv ${s} → ${s+1}</small></button>`}).join("")+"</div>";$("md").className="modal on";snd("lv")}

$("md").onclick=e=>{if(e.target.closest("[data-r]")){init();last=performance.now();return}
 const b=e.target.closest("[data-u]");if(!b)return;const u=UP.find(x=>x.id===b.dataset.u);u.f(P);P.up[u.id]=(P.up[u.id]||0)+1;pend--;
 if(pend>0)offer();else{$("md").className="modal";paused=false;last=performance.now()}ui()};

function dead(){
 over=true; snd("k");
 const b=best(); if(t>b.t)store.s("ns.t",Math.floor(t)); if(P.lv>b.l)store.s("ns.l",P.lv);
 
 const lb = window.globalLB || [];
 const isTop = (lb.length < 3 || score > lb[lb.length-1].s) && score > 0;

 let h=`<h2 class="rd">OYUN BİTTİ</h2>
 <p>Süre <b>${mmss(t)}</b> · Seviye <b>${P.lv}</b><br>Skor <b>${fmt(score)}</b></p>`;

 if(isTop){
  h+=`<span class="rec" style="margin:10px 0; display:inline-block; font-size:14px;">🏆 GLOBAL İLK 3'E GİRDİN!</span><br>
  <input type="text" id="in-name" placeholder="Adını Gir..." maxlength="10" autocomplete="off"><br>
  <button class="btn" onclick="saveScore()">KAYDET</button>`;
 }else{
  h+=`<button class="btn" data-r="1" style="margin-top:10px">TEKRAR DENE</button>`;
 }
 $("md").innerHTML=h;
 $("md").className="modal on";
}

window.saveScore = () => {
 const n = $("in-name").value.trim() || "Anonim";
 if(window.sendScoreToFirestore) {
   window.sendScoreToFirestore(n, score);
 }
 init(); last = performance.now();
};

const gk=(x,y)=>(Math.floor((x-ox)/SZ)+1024)*2048+Math.floor((y-oy)/SZ)+1024;
function near(x,y,rad,f){const a=Math.floor((x-ox-rad)/SZ)+1024,b=Math.floor((x-ox+rad)/SZ)+1024,c0=Math.floor((y-oy-rad)/SZ)+1024,d=Math.floor((y-oy+rad)/SZ)+1024;for(let i=a;i<=b;i++)for(let j=c0;j<=d;j++){const l=grid.get(i*2048+j);if(l)for(let k=0;k<l.length;k++)f(l[k])}}
function mkE(k,x,y){const s=TY[k],hm=1+t/55+t*t/60000+P.lv*.02;Es.push({k,x,y,r:s.r,hp:s.hp*hm,mh:s.hp*hm,sp:s.sp*Math.min(1.6,1+t/500)*(.9+R()*.2),dm:s.dm*(1+t/240),xp:s.xp,sc:s.sc,c:s.c,fl:0,ob:0})}
function ringPos(){const a=R()*TAU,d=Math.hypot(VW,VH)/2+60;return[P.x+Math.cos(a)*d,P.y+Math.sin(a)*d]}
function spawn(dt){spT-=dt;const cap=Math.min(340,180+P.lv*4);
 if(spT<=0&&Es.length<cap){spT=Math.max(.07,1-t/100);const n=1+Math.floor(P.lv/5)+(t>120?1:0);for(let i=0;i<n;i++){const r=R(),k=t>25&&r<.22?"d":t>55&&r>.82?"t":"n",p=ringPos();mkE(k,p[0],p[1])}}
 hordeT-=dt;if(hordeT<=0){hordeT=40;const n=18+Math.min(30,P.lv),d=Math.hypot(VW,VH)/2+60;for(let i=0;i<n;i++){const a=i/n*TAU;mkE("n",P.x+Math.cos(a)*d,P.y+Math.sin(a)*d)}banner("SÜRÜ GELİYOR!")}
 eliteT-=dt;if(eliteT<=0){eliteT=55;const p=ringPos();mkE("e",p[0],p[1]);banner("ELİT DÜŞMAN!")}}
function dmgE(e,d,cr){if(e.dead)return;e.hp-=d;e.fl=.07;if(Tx.length<36)Tx.push({x:e.x+R()*16-8,y:e.y-e.r,s:fn(d),c:cr,l:cr?.8:.4});if(e.hp<=0)die(e)}
function die(e){e.dead=1;score+=Math.round(e.sc*(1+Math.floor(combo/20)*.25));combo++;comboT=3;
 if(combo%25===0){rampT=5;banner("RAMPAGE ×"+combo)}
 if(Pa.length<260)for(let i=0;i<5;i++){const a=R()*TAU,s=50+R()*260;Pa.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:e.c,r:1+R()*3})}
 if(Gm.length<140)Gm.push({x:e.x,y:e.y,v:e.xp,s:300});else gain(e.xp);
 Pn.push({x:e.x,y:e.y,c:e.c,r:e.r*1.3});if(Pn.length>40)Pn.shift();shake=Math.min(14,shake+(e.k==="e"?12:e.k==="t"?5:1.2));snd("k");
 if(e.k==="e"){pend++;banner("HAZİNE! +1 YETENEK");if(!paused)offer()}}
function hitD(d){const cr=P.crit,tr=Math.floor(cr),ex=tr+(R()<cr-tr?1:0);return ex>0?{d:d*P.cdm*(1+.5*(ex-1)),c:1}:{d,c:0}}
function ring(x,y,m,c){if(Rg.length<24)Rg.push({x,y,r:6,m,c,l:1})}
function splash(x,y,d,sk){const rad=34+P.boom*16;ring(x,y,rad,"#ff8800");near(x,y,rad+40,e=>{if(e!==sk&&!e.dead&&Math.hypot(e.x-x,e.y-y)<rad+e.r)dmgE(e,d*.5,0)})}

let jp=null,jo={x:0,y:0},jv={x:0,y:0},key={};
cv.addEventListener("pointerdown",e=>{if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(x){}}if(ac&&ac.resume)ac.resume();if(jp!==null||paused||over)return;jp=e.pointerId;try{cv.setPointerCapture(jp)}catch(x){}jo={x:e.clientX,y:e.clientY};
 const b=$("jb"),s=$("js");b.style.display=s.style.display="block";b.style.transform=s.style.transform=`translate3d(${jo.x}px,${jo.y}px,0)`;e.preventDefault()});
cv.addEventListener("pointermove",e=>{if(e.pointerId!==jp)return;let dx=e.clientX-jo.x,dy=e.clientY-jo.y;const d=Math.hypot(dx,dy)||1,m=Math.min(d,56);dx=dx/d*m;dy=dy/d*m;
 $("js").style.transform=`translate3d(${jo.x+dx}px,${jo.y+dy}px,0)`;const k=m/56;jv=k<.1?{x:0,y:0}:{x:dx/m*k,y:dy/m*k}});
const rel=e=>{if(e.pointerId!==jp)return;jp=null;jv={x:0,y:0};$("jb").style.display=$("js").style.display="none"};
cv.addEventListener("pointerup",rel);cv.addEventListener("pointercancel",rel);
addEventListener("keydown",e=>key[e.key.toLowerCase()]=1);addEventListener("keyup",e=>key[e.key.toLowerCase()]=0);

function step(dt){t+=dt;
 let ix=jv.x,iy=jv.y;if(!ix&&!iy){ix=(key.d||key.arrowright?1:0)-(key.a||key.arrowleft?1:0);iy=(key.s||key.arrowdown?1:0)-(key.w||key.arrowup?1:0);const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}}
 const k=1-Math.exp(-dt*12);P.vx+=(ix*P.spd-P.vx)*k;P.vy+=(iy*P.spd-P.vy)*k;P.x+=P.vx*dt;P.y+=P.vy*dt;
 const ck=1-Math.exp(-dt*9);cam.x+=(P.x-cam.x)*ck;cam.y+=(P.y-cam.y)*ck;shake*=Math.exp(-dt*9);
 P.hp=Math.min(P.mhp,P.hp+P.reg*dt);if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}if(rampT>0)rampT-=dt;flash=Math.max(0,flash-dt);
 P.tr-=dt;if(P.tr<=0&&Math.hypot(P.vx,P.vy)>60&&Pa.length<260){P.tr=.04;Pa.push({x:P.x,y:P.y,vx:0,vy:0,l:.5,c:"hsl("+((190+P.lv*6)%360)+",100%,60%)",r:P.r*.6})}
 spawn(dt);
 ox=P.x;oy=P.y;grid.clear();for(const e of Es){const q=gk(e.x,e.y);let l=grid.get(q);if(!l){l=[];grid.set(q,l)}l.push(e)}
 for(const e of Es){const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
  if(d>Math.hypot(VW,VH)/2+400){const p=ringPos();e.x=p[0];e.y=p[1];continue}
  e.x+=dx/d*e.sp*dt;e.y+=dy/d*e.sp*dt;e.fl-=dt;
  const l=grid.get(gk(e.x,e.y));if(l&&l.length<14)for(const o of l)if(o!==e){const ax=e.x-o.x,ay=e.y-o.y,ad=Math.hypot(ax,ay),m=e.r+o.r;if(ad>0&&ad<m){const p=(m-ad)*.3/ad;e.x+=ax*p;e.y+=ay*p}}
  if(d<e.r+P.r){P.hp-=e.dm*P.arm*dt;flash=.25}}
 if(P.hp<=0&&!over){dead();return}
 P.cd-=dt;if(P.cd<=0){let tg=null,md=640*640;for(const e of Es){const d=(e.x-P.x)**2+(e.y-P.y)**2;if(d<md){md=d;tg=e}}
  if(tg){P.cd=1/(P.rate*(rampT>0?1.5:1));const a=Math.atan2(tg.y-P.y,tg.x-P.x),n=P.multi,st=n>1?Math.min(.22,TAU/n):0,a0=a-st*(n-1)/2,rr=Math.min(9,4+P.dmg/200);
   for(let i=0;i<n;i++){const an=a0+i*st;Bu.push({x:P.x,y:P.y,vx:Math.cos(an)*900,vy:Math.sin(an)*900,d:P.dmg,p:P.pierce,l:1.1,r:rr,h:[]})}}}
 for(const b of Bu){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(b.l<=0){b.dead=1;continue}
  near(b.x,b.y,50,e=>{if(b.dead||e.dead||b.h.includes(e))return;const dx=e.x-b.x,dy=e.y-b.y,rr=e.r+b.r;if(dx*dx+dy*dy>rr*rr)return;const h=hitD(b.d);dmgE(e,h.d,h.c);b.h.push(e);if(P.boom)splash(b.x,b.y,h.d,e);if(b.p--<=0)b.dead=1})}
 for(let i=0;i<P.orb;i++){const a=t*3.2+i*TAU/P.orb,rd=70+Math.min(50,P.orb*4),bx=P.x+Math.cos(a)*rd,by=P.y+Math.sin(a)*rd;
  near(bx,by,50,e=>{if(e.dead||e.ob>t||Math.hypot(e.x-bx,e.y-by)>e.r+13)return;e.ob=t+.3;const h=hitD(P.dmg*.7);dmgE(e,h.d,h.c)})}
 if(P.nova){P.novaT-=dt;if(P.novaT<=0){P.novaT=Math.max(1.2,6/(1+.25*P.nova));const rad=140+P.nova*18;ring(P.x,P.y,rad,"#ffd400");shake+=5;for(const e of Es)if(!e.dead&&Math.hypot(e.x-P.x,e.y-P.y)<rad+e.r)dmgE(e,P.dmg*(2+.5*P.nova),0)}}
 for(const g of Gm){const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1;if(d<P.mag)g.m=1;if(g.m){g.s+=1400*dt;g.x+=dx/d*g.s*dt;g.y+=dy/d*g.s*dt}if(d<P.r+8){g.dead=1;gain(g.v);snd("xp")}}
 for(const p of Pa){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*1.6}
 for(const x of Tx){x.y-=55*dt;x.l-=dt}for(const r of Rg){r.r+=(r.m-r.r)*Math.min(1,dt*9)+30*dt;r.l=1-r.r/r.m}
 Es=Es.filter(e=>!e.dead);Bu=Bu.filter(b=>!b.dead);Gm=Gm.filter(g=>!g.dead);Pa=Pa.filter(p=>p.l>0);Tx=Tx.filter(x=>x.l>0);Rg=Rg.filter(r=>r.l>0.02);
 uiT-=dt;if(uiT<=0){uiT=.1;ui();const cb=$("cb");if(combo>2&&comboT>0){cb.textContent=combo+" HİT";cb.className=rampT>0?"ra":"";cb.style.opacity=Math.min(1,comboT)}else cb.style.opacity=0}
 const fo=Math.max(flash*2,P.hp/P.mhp<.3?.35+.25*Math.sin(t*8):0);$("fl").style.opacity=Math.min(.8,fo).toFixed(2)}

function poly(x,y,r,n,rot){c.beginPath();for(let i=0;i<n;i++){const a=rot+i*TAU/n;i?c.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):c.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}c.closePath()}
function draw(){c.setTransform(1,0,0,1,0,0);c.fillStyle="#050508";c.fillRect(0,0,cv.width,cv.height);
 const kk=dpr*Z,sx=shake>.3?(R()-.5)*shake:0,sy=shake>.3?(R()-.5)*shake:0;c.setTransform(kk,0,0,kk,(VW/2-cam.x+sx)*kk,(VH/2-cam.y+sy)*kk);
 const L=cam.x-VW/2,T=cam.y-VH/2,Rr=L+VW,Bb=T+VH,hue=(190+P.lv*6)%360,col="hsl("+hue+",100%,60%)";
 c.strokeStyle="rgba(0,243,255,.07)";c.lineWidth=1;c.beginPath();for(let x=Math.floor(L/140)*140;x<Rr;x+=140){c.moveTo(x,T);c.lineTo(x,Bb)}for(let y=Math.floor(T/140)*140;y<Bb;y+=140){c.moveTo(L,y);c.lineTo(Rr,y)}c.stroke();
 c.globalAlpha=.22;for(const p of Pn){c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.fill()}c.globalAlpha=1;
 c.fillStyle="#00ff88";for(const g of Gm){c.beginPath();c.arc(g.x,g.y,5.5,0,TAU);c.fill()}
 c.lineJoin="round";
 for(const e of Es){if(e.x<L-60||e.x>Rr+60||e.y<T-60||e.y>Bb+60)continue;
  if(e.k==="d")poly(e.x,e.y,e.r*1.2,3,Math.atan2(P.y-e.y,P.x-e.x));else if(e.k==="e")poly(e.x,e.y,e.r,6,t*.5);else{c.beginPath();c.arc(e.x,e.y,e.r,0,TAU)}
  c.fillStyle=e.fl>0?"#fff":"#050508";c.fill();c.lineWidth=e.k==="n"||e.k==="d"?3:5;c.strokeStyle=e.c;c.stroke();
  if(e.mh>150&&e.hp<e.mh){c.fillStyle="rgba(255,255,255,.2)";c.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);c.fillStyle=e.c;c.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*Math.max(0,e.hp/e.mh),4)}}
 c.globalCompositeOperation="lighter";c.fillStyle=rampT>0?"#ff8800":col;for(const b of Bu){c.beginPath();c.arc(b.x,b.y,b.r,0,TAU);c.fill()}
 c.strokeStyle=col;c.lineWidth=3;for(let i=0;i<P.orb;i++){const a=t*3.2+i*TAU/P.orb,rd=70+Math.min(50,P.orb*4);poly(P.x+Math.cos(a)*rd,P.y+Math.sin(a)*rd,13,4,a*2);c.stroke()}
 for(const r of Rg){c.globalAlpha=Math.max(0,r.l);c.strokeStyle=r.c;c.lineWidth=5;c.beginPath();c.arc(r.x,r.y,r.r,0,TAU);c.stroke()}
 for(const p of Pa){c.globalAlpha=Math.max(0,p.l);c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.fill()}c.globalAlpha=1;
 const au=P.r+8+Math.min(30,P.lv*.9)+Math.sin(t*4)*2;c.strokeStyle=rampT>0?"rgba(255,136,0,.8)":col;c.globalAlpha=.55;c.lineWidth=rampT>0?4:2;c.beginPath();c.arc(P.x,P.y,au,0,TAU);c.stroke();
 c.globalAlpha=.12;c.fillStyle=col;c.beginPath();c.arc(P.x,P.y,au,0,TAU);c.fill();c.globalAlpha=1;c.globalCompositeOperation="source-over";
 c.fillStyle=col;c.beginPath();c.arc(P.x,P.y,P.r,0,TAU);c.fill();c.fillStyle="#fff";c.beginPath();c.arc(P.x,P.y,P.r*.45,0,TAU);c.fill();
 c.textAlign="center";c.lineWidth=3;c.strokeStyle="rgba(0,0,20,.8)";for(const x of Tx){c.globalAlpha=Math.min(1,x.l*2.5);c.font=(x.c?"900 22px":"700 14px")+" Orbitron,sans-serif";c.strokeText(x.s,x.x,x.y);c.fillStyle=x.c?"#ff3355":"#fff";c.fillText(x.s,x.x,x.y)}c.globalAlpha=1}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000||.016);last=now;if(!paused&&!over)step(dt);draw()}
resize();init();banner("Ekrana dokun ve sürükle");requestAnimationFrame(loop);
</script>
